# Держим бэкенд разбуженным в часы, когда им пользуются.
#
# Зачем. На бесплатном тарифе Render усыпляет сервис после 15 минут без
# запросов, и первый запрос после сна ждёт до 50 секунд. Раньше это было
# просто медленно, теперь — опаснее: клиенты ходят на бэкенд через прокси на
# Vercel (frontend/next.config.ts), а прокси не будет ждать пробуждения
# бесконечно. Пинг раз в 10 минут не даёт сервису заснуть, и холодного старта
# не случается вовсе — заодно уходят и те самые 20-50 секунд ожидания.
#
# Почему не круглосуточно. У бесплатного тарифа Render лимит 750 часов работы
# в месяц на весь аккаунт. Круглосуточно — это ~744 часа, впритык и без
# запаса на второй сервис. Здесь 02:00-18:00 UTC, то есть 07:00-23:00 по
# Душанбе: примерно 500 часов в месяц. Ночью сервис спит, а первый утренний
# студент разбудит его сам — как и раньше.
#
# GitHub может задержать запуск по расписанию на несколько минут в час пик;
# тогда сервис успеет заснуть и один запрос окажется долгим. Это не авария,
# просто возврат к прежнему поведению.

name: keepalive

on:
  schedule:
    - cron: '*/10 2-18 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить бэкенд
        run: curl -fsS --max-time 90 https://msu-schedule.onrender.com/health
