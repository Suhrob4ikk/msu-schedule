# Как устроен бэкенд на Render (https://msu-schedule.onrender.com).
#
# ВАЖНО: сервис создан вручную через дашборд, этот файл автоматически НЕ
# применяется. Он здесь как памятка — чтобы через полгода не гадать, какие
# были настройки, и чтобы можно было пересоздать сервис по образцу.
#
# Секреты задаются в дашборде (Environment) и в репозиторий не попадают:
# ADMIN_SECRET, DEV_PANEL_PASSWORD, RESEND_API_KEY, VAPID_PRIVATE_KEY,
# VAPID_PUBLIC_KEY, GITHUB_API_TOKEN, NOTIFY_EMAIL, DATABASE_URL, DATA_DIR.
#
# База — Postgres на Neon: DATABASE_URL задан в дашборде (с 4 окт 2026), данные
# переживают деплой. Без DATABASE_URL бэкенд откатится на SQLite в эфемерной
# файловой системе — тогда при каждом деплое теряются регистрации, подписки на
# push и история изменений (/health покажет "db": "sqlite").

services:
  - type: web
    name: msu-schedule
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
