# Как устроен бэкенд на Render (https://msu-schedule.onrender.com).
#
# ВАЖНО: сервис создан вручную через дашборд, этот файл автоматически НЕ
# применяется. Он здесь как памятка — чтобы через полгода не гадать, какие
# были настройки, и чтобы можно было пересоздать сервис по образцу.
#
# Секреты задаются в дашборде (Environment) и в репозиторий не попадают:
# ADMIN_SECRET, DEV_PANEL_PASSWORD, RESEND_API_KEY, VAPID_PRIVATE_KEY,
# VAPID_PUBLIC_KEY, GITHUB_API_TOKEN, NOTIFY_EMAIL, DATABASE_URL, DATA_DIR.
#
# Диска (disk) на бесплатном тарифе нет — база SQLite лежит в эфемерной
# файловой системе и пересоздаётся при каждом деплое. Само расписание от
# этого не страдает: оно восстанавливается первой же синхронизацией с msu.tj
# при старте. Теряются только регистрации пользователей и подписки на push.

services:
  - type: web
    name: msu-schedule
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
